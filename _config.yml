title: "Ryan Ye"
title_suffix: "Ryan Ye | Cornell CS"
description: "Personal website of Ryan Ye, a computer science student at Cornell University doing AI for science research: agents for scientific discovery and computer vision."
author: "Ryan Ye"
email: "rmy43@cornell.edu"
github_username: "ryanmye"
linkedin_username: "rmy43"
url: "https://ryanmye.github.io"
baseurl: ""
twitter_username: "ryanmye0"

theme: null

# Cache-busting version for assets/css/styles.css — bump when the stylesheet changes.
css_version: 14

plugins:
  - jekyll-sitemap
  - jekyll-feed

markdown: kramdown
highlighter: rouge
permalink: /blog/:year/:month/:day/:title/
# No automatic excerpts: a post has `excerpt` only when its front matter sets
# one (the blog index then shows it; otherwise the first 24 words).
excerpt_separator: ""

kramdown:
  input: GFM
  syntax_highlighter: rouge

local_editor: true

# Image delivery configuration. `source` selects which backend renders image URLs;
# all template-level calls go through _includes/image_src.html.
#   local              - default, serves pre-generated thumbnails from assets/images/
#   cloudflare_resize  - rewrites URLs through a Cloudflare zone's /cdn-cgi/image/ prefix
#   cloudflare_images  - uses https://imagedelivery.net/<hash>/<id>/<variant> (requires cf_id in _data/image_meta.yml)
images:
  source: local
  widths:
    thumb: 600
    med: 1600
  cloudflare:
    account_hash: ""
    resize_prefix: "/cdn-cgi/image"

collections:
  albums:
    output: true
    permalink: /albums/:title/

# Keep in sync with the other config; Jekyll replaces exclude lists, it does not merge them.
# (_config_prod.yml repeats this whole list and adds the editor-only files.)
exclude:
  - README.md
  - CLAUDE.md
  - LOCAL_DEV.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - node_modules
  - vendor
  - scripts/
  - .github/
  - _deleted/
  - resume/
  - bin/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
      type: "albums"
    values:
      layout: "album"
  - scope:
      path: "**.pdf"
    values:
      sitemap: false
