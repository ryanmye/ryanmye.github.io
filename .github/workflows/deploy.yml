name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Job-level so both `bundle install` (setup-ruby) and `bundle exec` see it.
      BUNDLE_WITHOUT: development:test
    steps:
      - uses: actions/checkout@v4

      # Ruby version comes from .ruby-version; gems from the committed Gemfile.lock.
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Build with Jekyll
        run: bundle exec jekyll build --config _config.yml,_config_prod.yml
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
