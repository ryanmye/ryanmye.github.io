# About page content
bio: |
  I'm an undergraduate at Cornell ([College of Engineering](https://www.duffield.cornell.edu)) with interests in ***machine
  learning***, ***computer vision***, and ***AI for scientific discovery***. I work where
  better data and automation can help researchers scale their work.

  I conduct research in the [Sun Lab](https://lab.jenjsun.com/) (PI: Jennifer Sun), working on computer vision
  methods for dairy calf behavior analysis to support veterinary researchers studying
  early indicators of disease and welfare. Outside of academics, I play violin in a
  quartet and serve in [Cru](https://www.crucornell.com) as a student leader in worship team. When the weather is
  nice, I like to throw around a Frisbee; however, the weather is never nice in
  Ithaca.

