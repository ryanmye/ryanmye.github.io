seeking: "This cycle I'm looking for a Summer 2027 software engineering internship."

# The homepage intro paragraph (about 60 words; Markdown): the research
# plus one stack clause (resume.tex Technical Skills). School, degree and
# class year are on the credential line under the name (built from
# `education`), so the intro does not repeat them.
intro: |
  I do AI for science research in the [Sun Lab](https://lab.jenjsun.com/) (PI: Jennifer Sun). Right now I'm working on
  agents for open-ended scientific discovery; I've also built computer vision models for animal behavior, from dairy
  calf posture on farm video to video models that recognize behavior across labs. I work in Python and PyTorch, and
  build web apps with React and Node.js.

