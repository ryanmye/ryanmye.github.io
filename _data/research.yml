positions:
  - title: "Statistical Validation for Automated Hypothesis Discovery"
    slug: "statistical-validation"
    card_summary: "A separate statistical check on what AI discovery agents report, so only a small, preset share of reported findings are false. I implemented the tests and reporting rules, ran the agents, and stress-tested the check."
    role: "Undergraduate Researcher"
    lab: "Sun Lab"
    pi: "Jennifer Sun"
    institution: "Cornell University"
    date: "Jun 2026 – present"
    description: |
      A separate statistical check that decides which of an AI discovery agent's findings
      get reported, so that only a small, preset share of them are false. Left to pick
      their own findings, the agents we tested reported many that were false: 18 to 66% of
      their reported discoveries. Here the agent searches as usual and then submits
      everything it considered; each item gets one test on data the agent never had access
      to, and a standard multiple-testing correction decides what is reported. On test
      datasets where the true relationships are known, this brought false findings below
      1% for every agent, and most agents lost some true findings in exchange. I
      implemented the tests and the reporting rules, which are standard statistical
      procedures, ran the agent systems (five systems, over 500 runs in 13 test
      settings), and ran the stress tests. AIMI Junior Affiliate project.
    focus:
      - title: "The statistical tests"
        detail: "One pre-set randomization test for each of 11 claim types (correlations, group differences, interactions, adjusted associations, trends, and others), each giving a p-value and an e-value. Checked by simulation, across sample sizes, that each test's false-positive rate stays near its nominal level when there is no effect"
      - title: "Reporting rules"
        detail: "Standard false discovery rate procedures (Benjamini-Hochberg, Benjamini-Yekutieli, and e-value versions) applied to everything an agent submitted. Fresh data without the correction was not enough for any agent, and the correction on data the agent had already searched was not enough for all of them; only the two together held the error rate for every agent"
      - title: "Running the agents"
        detail: "Ran five agent systems of different designs on the same task, over 500 runs in 13 test settings: explore a dataset, submit a ranked list of everything it considered, and mark which items it would report as findings"
      - title: "Stress tests"
        detail: "Showed that the error control can fail when results from the held-out data are fed back to the agent, or when the agent is given the held-out data to manage itself. Over the summer I also ran comparisons with an existing method in which an AI agent designs the validation tests"
    homepage: true
    index_title: "Statistical Validation for Hypothesis Discovery"
    index_description: "A separate statistical check that keeps the share of false findings AI discovery agents report under a preset level. I implemented the tests and reporting rules, ran the agents, and stress-tested the check."
    cv: true
    cv_title: "Sun Lab · statistical validation"
    cv_date: "Jun 2026 – present"
    cv_subtitle: "Statistical validation for automated hypothesis discovery"
    cv_bullets:
      - "Implemented the randomization tests (p- and e-values for 11 claim types) and the false discovery rate reporting rules behind an independent check on what AI discovery agents report"
      - "Ran five agent systems, 500+ runs in 13 test settings with known ground truth: the agents' own reports were 18 to 66% false; the check brought that below 1% for every agent"
      - "Stress-tested the check: showed its error control can fail when held-out results are fed back to the agent"

  - title: "Video Behavior Recognition Across Labs (MABe)"
    slug: "mabe"
    card_summary: "Video foundation models that recognize animal behavior across 15 labs' datasets. I designed the fine-tuning and built the training pipeline on Cornell's GPU cluster."
    role: "Undergraduate Researcher"
    lab: "Sun Lab"
    pi: "Jennifer Sun"
    institution: "Cornell University"
    date: "Feb 2026 – present"
    description: |
      A video-based action recognition system that generalizes across 15 independently
      collected animal behavior datasets, grown from a Kaggle "Multi-Agent Behavior"
      competition entry. In a shared lab codebase, I designed LoRA fine-tuning of a frozen
      video foundation model with a self-authored kinematic auxiliary loss and wrote and ran
      the 8-stage SLURM chain that took all 15 labs from raw video to evaluated 5-fold
      ensembles; it beat the frozen-backbone baseline on 9 of 15 datasets, and for one lab,
      the video-only model beat that lab's pose-tracking ceiling.
    focus:
      - title: "Fine-tuning video foundation models"
        detail: "Ahead of the baseline on at least one split for 13 of 15 datasets; ablations of the kinematic loss and of checkpoint selection, and a video-vs-pose pilot that retrains a pose-tracking model's classifier architecture on our video features"
      - title: "Training infrastructure"
        detail: "An 8-stage SLURM chain (stage video, fine-tune, extract, stage features, train 5-fold, evaluate, copy back, clean up) run across all 15 datasets on Cornell's GPU cluster, with per-fold parallel jobs and a merge step added to the lab's cross-validation and threshold calibration"
      - title: "Backbone, data and GPU bring-up"
        detail: "Moved the VideoPRISM backbone from JAX to PyTorch with output parity checked, which made LoRA fine-tuning possible; staged video, and extracted features of up to 1.9 TB per lab, onto node-local NVMe to end NFS deadlocks; brought the pipeline up on Blackwell GPUs through a toggleable parallel CUDA 12.8 environment; 21 unit tests"
    homepage: true
    index_title: "Behavior Recognition Across Labs (MABe)"
    index_description: "Beat the frozen-backbone baseline on 9 of 15 animal behavior datasets by LoRA fine-tuning a video foundation model, and built the training pipeline that runs across all 15."
    cv: true
    cv_title: "Sun Lab · MABe"
    cv_date: "Feb 2026 – present"
    cv_subtitle: "Multi-lab animal behavior video recognition"
    cv_bullets:
      - "Beat the frozen-backbone baseline on 9 of 15 datasets (13 of 15 on at least one split) by LoRA fine-tuning a video foundation model with a self-authored kinematic auxiliary loss"
      - "Wrote and ran the 8-stage SLURM chain that took all 15 labs from raw video to evaluated 5-fold ensembles, staging up to 1.9 TB of features per lab on node-local NVMe; ran on Blackwell GPUs"
      - "Moved the VideoPRISM backbone from JAX to PyTorch with parity checked, which enabled LoRA fine-tuning; wrote the PyTorch training stage, video loader, and 21 unit tests"

  - title: "AI for Animal Behavior Monitoring"
    slug: "calf-behavior"
    card_summary: "Computer vision that classifies dairy calf posture from farm video, for veterinary researchers. I annotated the data and built the detection and classification pipeline."
    figure:
      src: "/assets/images/research/calf-pose-detection.webp"
      alt: "Overhead farm camera view of three calves in neighboring pens, each boxed and labeled by the model: one standing (0.99) and two lying (1.00 and 0.99)."
      caption: "The pipeline labeling calf posture on farm camera footage (from the ADSA 2026 poster)."
      width: 1000
      height: 562
    role: "Undergraduate Researcher"
    lab: "Sun Lab"
    pi: "Jennifer Sun"
    institution: "Cornell University"
    date: "May 2025 – present"
    description: |
      Computer vision for dairy calf behavior on working farms, for veterinary researchers
      studying early indicators of disease and welfare. I annotated the calf dataset,
      fine-tuned a YOLO detector on it, and benchmarked DINOv2 against DINOv3 features and
      vision-language models for posture and ear tag recognition.
    focus:
      - title: "Self-supervised vision for livestock monitoring"
        detail: "Posture classification from frozen DINOv2/DINOv3 features with lightweight classifier heads, plus a YOLO detector fine-tuned on a self-annotated calf dataset; mean F1 rose from 0.928 with 300 training images to 0.957 with 1,000 (24 runs per setting)"
      - title: "Vision-language models on farm imagery"
        detail: "Benchmarked Qwen, Gemma 3, Gemini 2.5 Pro, PaliGemma, and NVLM for ear tag and pose recognition; 77% of ear tag OCR responses were unreadable on real farm images"
      - title: "Bridging AI and veterinary research"
        detail: "An interactive Jupyter workflow so veterinary researchers can run experiments and interpret results without an ML background"
      - title: "ADSA 2026 poster"
        detail: "\"Automating pose detection in calves: a computer vision framework for non-invasive behavioral monitoring\"; manuscript in preparation"
    note: "Conducted as part of the Bowers Undergraduate Research Experience (BURE) with support from a CIDA grant."
    homepage: true
    index_title: "Calf Behavior Monitoring"
    index_description: "Reached a mean F1 of 0.957 on calf posture classification from DINO features and a YOLO detector fine-tuned on a dataset I annotated; poster presented at ADSA 2026."
    cv: true
    cv_title: "Sun Lab · calf behavior"
    cv_date: "May 2025 – present"
    cv_subtitle: "Calf behavior monitoring (BURE Fellow, CIDA grant)"
    cv_bullets:
      - "Built a calf posture classification pipeline from DINOv2/DINOv3 features and a YOLO detector fine-tuned on a self-annotated dataset; mean F1 0.957 with 1,000 training images"
      - "Compared DINOv2 and DINOv3 ensembles at four training-set sizes, 24 runs per setting"
      - "Benchmarked vision-language models (Qwen, Gemma 3, Gemini 2.5 Pro, PaliGemma, NVLM) for ear tag and pose recognition on farm imagery"
      - "Built an interactive Jupyter workflow for veterinary researchers"
      - "Poster presented at ADSA 2026; manuscript in preparation"

