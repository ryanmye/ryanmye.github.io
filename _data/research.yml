# Positions, newest first. `date` uses one format: "Mon YYYY – present",
# "Mon YYYY – Mon YYYY", or a season ("Summer 2026"), with an en dash.
# research.md groups positions by `lab` and prints one header per lab:
# "<lab>, <institution> · PI <pi> · <date of the lab's oldest position>".
#
# Card fields (homepage "Selected work" and /research/):
#   slug            anchor id on /research/ (the card's "Details" target)
#   card_summary    two short sentences on the card: what the project is,
#                   then what he did (first person). Not a metric: no
#                   headline numbers on the cards.
#   figure          optional {src, alt, caption, width, height}; /research/
#                   shows it left of the description when set; without it
#                   the description takes the full measure
positions:
  - title: "Statistical Validation for Automated Hypothesis Discovery"
    slug: "statistical-validation"
    card_summary: "The statistical layer that checks an automated scientific-discovery agent's findings. I built it and found where its false-discovery guarantees broke."
    role: "Undergraduate Researcher"
    lab: "Sun Lab"
    pi: "Jennifer Sun"
    institution: "Cornell University"
    date: "Summer 2026"
    description: |
      Showed that an automated scientific discovery system reported far more false findings
      than it promised: its false discovery rate (the share of reported findings that are
      wrong) ran 35 to 41% against a 10% target, and up to 99.3% when adaptive selection
      reused holdout data, which led to the conservative controller becoming the default.
      I built the system's statistical validation layer, which checks its findings; the
      system searches over thousands of hypotheses and would otherwise mostly report noise.
      AIMI Junior Affiliate project.
    focus:
      - title: "Validation layer from scratch"
        detail: "A config-gated add-on with a typed anytime-valid evidence interface, e-value robustness fixes, interval-null tests, and a portfolio-FDR test suite"
      - title: "Finding where the guarantees broke"
        detail: "The FDR controller only saw values that had already cleared a self-referential local threshold; shipped two corrected registration modes. A separate scaling mismatch had the default controller silently making zero discoveries across 261,904 real clinical-trial p-values"
      - title: "Adaptive-selection vulnerability"
        detail: "Showed that a smarter tree selector could exploit reused holdout data to bias which hypotheses got tested"
      - title: "Validation against real data"
        detail: "Four real-world datasets including a 250K-row clinical-trials corpus; benchmarked 8 candidate controllers against the published online-FDR literature; drove a null-data incoherence failure mode from 67% to 10.5%"
    homepage: true
    index_title: "Statistical Validation for Hypothesis Discovery"
    index_description: "Showed that an automated hypothesis discovery system's false discovery rate ran 35 to 41% against a 10% target, and built the statistical validation layer that checks its findings."
    cv: true
    cv_title: "Sun Lab · statistical validation"
    cv_date: "Summer 2026"
    cv_subtitle: "Statistical validation for automated hypothesis discovery"
    cv_bullets:
      - "Showed an MCTS-based discovery system's false discovery rate ran 35 to 41% against a 10% target; shipped two corrected registration modes"
      - "Showed that reusing holdout data under adaptive tree selection pushed the false discovery rate to 99.3% at scale, which led to the conservative controller becoming the default"
      - "Built the validation layer (anytime-valid evidence interface, e-value fixes, interval-null tests) and benchmarked 8 controllers on four real-world datasets"

  - title: "Video Behavior Recognition Across Labs (MABe)"
    slug: "mabe"
    card_summary: "Video foundation models that recognize animal behavior across 15 labs' datasets. I designed the fine-tuning and built the training pipeline on Cornell's GPU cluster."
    role: "Undergraduate Researcher"
    lab: "Sun Lab"
    pi: "Jennifer Sun"
    institution: "Cornell University"
    date: "Feb 2026 – present"
    description: |
      A video-based action recognition system that generalizes across 15 independently
      collected animal behavior datasets, grown from a Kaggle "Multi-Agent Behavior"
      competition entry. In a shared lab codebase, I designed LoRA fine-tuning of a frozen
      video foundation model with a self-authored kinematic auxiliary loss and built the
      8-stage SLURM training pipeline; it beat the frozen-backbone baseline on 9 of 15
      datasets, and for one lab, the video-only model beat that lab's pose-tracking ceiling.
    focus:
      - title: "Fine-tuning video foundation models"
        detail: "Ahead of the baseline on at least one split for 13 of 15 datasets; ablations of the kinematic loss and of checkpoint selection, and a like-for-like comparison against a pose-tracking model's frozen classifier"
      - title: "Training infrastructure"
        detail: "An 8-stage SLURM pipeline (fine-tune, extract, train, evaluate) with 5-fold cross-validation and threshold calibration, run across all 15 datasets on Cornell's GPU cluster"
      - title: "Data and GPU bring-up"
        detail: "Wrote the staging pipeline that moves terabytes of video (up to 1.9 TB per lab) to node-local NVMe before training and a balanced sampler for severe multi-label class imbalance; brought the pipeline up on Blackwell GPUs through a toggleable parallel CUDA 12.8 environment"
    homepage: true
    index_title: "Behavior Recognition Across Labs (MABe)"
    index_description: "Beat the frozen-backbone baseline on 9 of 15 animal behavior datasets by LoRA fine-tuning a video foundation model, and built the training pipeline that runs across all 15."
    cv: true
    cv_title: "Sun Lab · MABe"
    cv_date: "Feb 2026 – present"
    cv_subtitle: "Multi-lab animal behavior video recognition"
    cv_bullets:
      - "Beat the frozen-backbone baseline on 9 of 15 datasets (13 of 15 on at least one split) by LoRA fine-tuning a frozen video foundation model with a self-authored kinematic auxiliary loss"
      - "Built the 5-fold cross-validation, threshold calibration, and 8-stage SLURM training pipeline used across all 15 datasets; brought it up on Blackwell GPUs with CUDA 12.8"
      - "Wrote the staging pipeline that moves terabytes of video to node-local NVMe, a balanced sampler for multi-label class imbalance, and the JAX baseline for the Kaggle competition the project grew out of"

  - title: "AI for Animal Behavior Monitoring"
    slug: "calf-behavior"
    card_summary: "Computer vision that classifies dairy calf posture from farm video, for veterinary researchers. I annotated the data and built the detection and classification pipeline."
    figure:
      src: "/assets/images/research/calf-pose-detection.webp"
      alt: "Overhead farm camera view of three calves in neighboring pens, each boxed and labeled by the model: one standing (0.99) and two lying (1.00 and 0.99)."
      caption: "The pipeline labeling calf posture on farm camera footage (from the ADSA 2026 poster)."
      width: 1000
      height: 562
    role: "Undergraduate Researcher"
    lab: "Sun Lab"
    pi: "Jennifer Sun"
    institution: "Cornell University"
    date: "May 2025 – present"
    description: |
      Computer vision for dairy calf behavior on working farms, for veterinary researchers
      studying early indicators of disease and welfare. I annotated the calf dataset,
      fine-tuned a YOLO detector on it, and benchmarked DINOv2 against DINOv3 features and
      vision-language models for posture and ear tag recognition.
    focus:
      - title: "Self-supervised vision for livestock monitoring"
        detail: "Posture classification from frozen DINOv2/DINOv3 features with lightweight classifier heads, plus a YOLO detector fine-tuned on a self-annotated calf dataset; best F1 rose from 0.928 at 300 training images to 0.957 at 1,000"
      - title: "Vision-language models on farm imagery"
        detail: "Benchmarked Qwen, Gemma 3, PaliGemma, and NVLM for ear tag and pose recognition; 77% of ear tag OCR responses were unreadable on real farm images"
      - title: "Bridging AI and veterinary research"
        detail: "An interactive Jupyter workflow so veterinary researchers can run experiments and interpret results without an ML background"
      - title: "ADSA 2026 poster"
        detail: "\"Automating pose detection in calves: a computer vision framework for non-invasive behavioral monitoring\"; manuscript in preparation"
    note: "Conducted as part of the Bowers Undergraduate Research Experience (BURE) with support from a CIDA grant."
    homepage: true
    index_title: "Calf Behavior Monitoring"
    index_description: "Reached F1 0.957 on calf posture classification from DINO features and a YOLO detector fine-tuned on a dataset I annotated; poster presented at ADSA 2026."
    cv: true
    cv_title: "Sun Lab · calf behavior"
    cv_date: "May 2025 – present"
    cv_subtitle: "Bowers Undergraduate Research Experience (BURE) — CIDA Grant Recipient"
    cv_bullets:
      - "Built a calf posture classification pipeline from DINOv2/DINOv3 features and a YOLO detector fine-tuned on a self-annotated dataset; best F1 0.957"
      - "Ran 24 comparison runs across training-set sizes benchmarking DINOv2 vs. DINOv3 ensembles"
      - "Benchmarked vision-language models (Qwen, Gemma 3, PaliGemma, NVLM) for ear tag and pose recognition on farm imagery"
      - "Built an interactive Jupyter workflow for veterinary researchers"
      - "Poster presented at ADSA 2026; manuscript in preparation"

