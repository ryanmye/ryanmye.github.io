# Projects showcase. The order is Ryan's choice (Oct 2026): DoRA, Worship
# Rig, World Seed, Geometric Art, then the rest. Keep it unless he says so.
# Research projects live in research.yml, not here.
# `summary`: the one-line result shown in the lists (Markdown; bold the one
#   key number, sparingly).
# `short` (optional, featured projects): the homepage's version of the
#   summary, one to two lines in the homepage Projects column (Markdown);
#   the homepage falls back to `summary`, /projects/ always shows `summary`.
# `context`: short muted meta (course, team size, event).
# `featured: true` (at most two): listed first on the homepage and
#   /projects/ with the summary (other homepage rows show title, context
#   and date), full width with a larger title on /projects/.
# `description` and `bullets` sit behind "Details" on /projects/.
# `site` (optional): a project page, shown as "site →" before "code →" (`url`).
# `image` (optional, /projects/ only): {src, alt, width, height}. A real
#   picture of the project (a screenshot or a results figure), saved under
#   /assets/images/projects/ at 16:10 and about 1200px wide; width and height
#   are its pixel size. The list shows it at 16:10, cropped to fill, and
#   links it to `site`, else `url`. Leave it out when there is no real
#   picture; nothing is drawn in its place. The homepage never shows it.
projects:
  - title: "DoRA Re-Implementation and Evaluation"
    date: "Spring 2026"
    featured: true
    short: "4-person team re-implementation of DoRA; I ran the experiments on the HPC cluster, built the evaluation harness, and diagnosed a critical bug in the DoRA layer."
    summary: "4-person team re-implementation of DoRA, tested against LoRA on Qwen2.5-3B. Trained on little data, both methods often ranked the right AMC12 answer highest but failed to generate it; more data closed the gap, and DoRA reached 46%, ahead of LoRA's 36% on the same data. I ran the experiments on the HPC cluster, built the evaluation harness, and diagnosed a critical bug in the DoRA layer."
    context: "CS 4782 (Deep Learning), 4-person team"
    description: "CS 4782 final project, Spring 2026. We wrote DoRA as a PyTorch layer, fine-tuned Qwen2.5-3B with it and with LoRA on 1K to 27.5K math problems, and tested on AMC12 2024/2025 and the MATH benchmark. To separate what a model knows from what it can write out, we scored AMC12 three ways: a one-token probe over the answer letters, generate then probe, and plain generation."
    bullets:
      - "Team finding: after training the base model on 7.5K problems, the probe picked the right AMC12 2024 answer 38% of the time for both methods, but generated answers were right 18% (LoRA) and 12% (DoRA). With 27.5K problems the gap closed and DoRA reached 46%, against LoRA's 36% on the same data"
      - "At 3B scale we only partly reproduced the paper's DoRA-over-LoRA result, and fine-tuning lowered MATH accuracy for both methods"
      - "Ran all training and evaluation on Cornell's HPC cluster: ranks 2, 4, and 8, three dataset sizes, base and instruct models"
      - "Wrote the evaluation harness (logit-probe and two-pass scoring), the benchmark and training-data scripts with a leakage filter, checkpoint averaging, the tables and figures, and the first draft of the report"
      - "Diagnosed a critical bug in the team's DoRA layer and contributed to the problem formulation"
    url: "https://github.com/leonjiao5/cs4782-project"
    image:
      src: "/assets/images/projects/dora.webp"
      alt: "Bar chart of AMC12 2024 accuracy for LoRA and DoRA trained on a light and a heavy dataset, comparing the logit probe with two-pass and greedy answers."
      width: 1200
      height: 750
    cv: true
    cv_tech: "PyTorch, Hugging Face PEFT"
    cv_bullets:
      - "4-person team re-implementation of DoRA in PyTorch, tested against LoRA on Qwen2.5-3B (AMC12, MATH)"
      - "Ran all experiments on the HPC cluster; built the evaluation harness (logit-probe, two-pass, and generation scoring), data pipeline, and analysis; diagnosed a critical bug in the DoRA layer"

  - title: "Worship Rig"
    date: "Sep 2026"
    featured: true
    short: "A Mac app that turns a MIDI keyboard into a keys rig for worship bands, with its own Web Audio engine, 43 instruments, and a key drone."
    summary: "A Mac app that turns a MIDI keyboard into a keys rig for a worship band. Each song sets up to four sounds, their effects, and a drone in the song's key, played by its own Web Audio engine with **43 instruments** and backed by over 1,000 automated tests."
    context: "Personal project; Electron, Web Audio"
    description: "Built for the keys player in a worship band: plug in a MIDI keyboard, pick a song from the setlist, and play. It runs as a Mac app (Electron) or in Chrome, and everything, the sounds included, stays on the Mac, so nothing streams during a set."
    bullets:
      - "An audio engine on Web Audio that loads each song's samples and reverbs ahead of time and schedules every event on the audio clock, so the same graph renders offline for tests and level calibration"
      - "43 instruments: 23 multisampled (grand, upright, electric pianos, mallets, guitars), 16 synth patches, and a drawbar organ with a rotary speaker and four presets, plus a drone that holds the root, fifth, and octave of the song's key"
      - "An 8-band EQ per sound drawn over a piano keyboard, 19 factory songs, setlists, transpose, MIDI Learn, WAV recording through an AudioWorklet, a menu-bar mode, and 8 themes"
      - "A converter that reads Apple's EXS instrument format and turns GarageBand and Logic sampled instruments into packs the app plays, kept on the user's Mac for licensing"
      - "Over 1,000 automated tests (offline audio renders, Playwright, Electron) and a 20-minute soak test; GitHub Actions builds the Apple Silicon and Intel releases"
    url: "https://github.com/ryanmye/worship-rig"
    site: "https://ryanmye.github.io/worship-rig/"
    image:
      src: "/assets/images/projects/worship-rig.webp"
      alt: "The Worship Rig perform screen: the song name and key, a six-song setlist, keys and pad channel strips with faders, the key drone controls, notes, and an on-screen keyboard."
      width: 1200
      height: 750
    cv: true
    cv_tech: "Electron, JavaScript, Web Audio"
    cv_bullets:
      - "Mac app (Electron) that turns a MIDI keyboard into a keys rig for worship bands: 43 instruments, a key drone, setlists, a per-sound 8-band EQ, WAV recording"
      - "Web Audio engine that also renders offline for tests and level calibration; GarageBand/Logic sample converter; 1,000+ automated tests; CI releases for Apple Silicon and Intel"

  - title: "World Seed"
    date: "Oct 2026"
    summary: "A planet and civilization simulator that runs in the browser. Give it a number and it builds a planet, then simulates its history year by year: peoples spreading from a few cradles, farming, sailing, trading, forming states, going to war, and founding faiths and dynasties. No backend and no language model; the same seed always gives the same world."
    context: "Personal project; TypeScript, three.js, Web Worker"
    description: "By default it simulates 2,000 years, and it can keep going. Every name, event, and line of the chronicle comes from code. The simulation is deterministic, so a seed is a world, and the address bar holds the seed and any nudges you have given, so a link reproduces the world you were looking at."
    bullets:
      - "The planet: tectonic plates raise mountains and open oceans, and temperature, rainfall, rivers, and biomes follow from the land"
      - "The history: migration and farming, voyages and exploration, species and crops, trade, roads and ports, states and wars, pirates and bandits, goods, disease, rulers and dynasties, faiths, ideas, tourism, and landmarks that are raised, ruined, and restored"
      - "Looking at it: a 3D globe or a flat map with views such as terrain, population, factions, and faiths; a chronicle of events; a street-level city view with 3D buildings; and sagas that tell a prose history of the world, a people, a state, a city, or a ruling house"
      - "Nudges: urge a people, a state, or a town to explore, settle, make war or peace, or take up a faith. An order raises the odds of something the simulation could do anyway, and the rules decide whether it happens"
      - "Built to be reproducible: each system draws from its own seeded random stream and uses only arithmetic that every JavaScript engine computes identically, and the tests check that turning any optional system off gives exactly the world without it"
      - "The simulation runs in a Web Worker, so the globe is on screen while history is still being computed, and worlds are cached in the browser"
    url: "https://github.com/ryanmye/worldseed"
    site: "https://ryanmye.github.io/worldseed/"
    image:
      src: "/assets/images/projects/worldseed.webp"
      alt: "World Seed at seed 42 in the year 4067: a globe covered in colored states, cities, and trade lanes, with panels for peoples, factions, goods, faiths, and a chronicle of events."
      width: 1200
      height: 750

  - title: "Geometric Art"
    date: "Oct 2026"
    summary: "A browser app that rebuilds a photo from geometric shapes: overlapping translucent shapes, a gap-free triangle mesh, or a polygon mosaic. It runs entirely on your machine, with nothing uploaded."
    context: "Personal project; TypeScript, Web Workers"
    description: "Drop in a photo (iPhone HEIC included) or pick a sample, press Start, and watch the picture rebuild. The same engines also run from the command line, which is how the animations in the geometric art album were made."
    bullets:
      - "Overlapping shapes: each new shape is picked from random candidates and refined by hill climbing, its color computed directly as the best fit, with candidates drawn more often where the picture is worst"
      - "Triangle mesh and polygon mosaic: Delaunay triangles or Voronoi cells over a set of points, optimized by threshold accepting (a relative of simulated annealing) that rescores only the cells around each moved point"
      - "Searches run in parallel across a pool of web workers, and the same seed always gives the same picture"
    url: "https://github.com/ryanmye/geometric-art"
    site: "https://ryanmye.github.io/geometric-art/"
    image:
      src: "/assets/images/projects/geometric-art.webp"
      alt: "The Mona Lisa next to the same painting rebuilt as a mesh of flat-colored triangles."
      width: 675
      height: 422

  - title: "Traveling Salesman: Conversational Flight Search"
    date: "Mar 2026"
    summary: "Hackathon project: describe a trip in plain language and see matching flights on a 2D map or 3D globe. I built most of the React frontend: the trip planner, the map and globe, and the plan cards, and reworked the chat panel."
    context: "Cornell AI Hackathon; React frontend"
    description: "Built at the Cornell AI Hackathon in March 2026. A Claude agent turns a request like \"fly from NYC to somewhere warm in late June, under $400\" into airports and dates, searches Google Flights, and ranks the results; the page shows the parsed requirements, the routes, and the ranked flight plans."
    bullets:
      - "Built the route view: a 2D map with wraparound panning and a 3D globe with drag-to-rotate and zoom (d3-geo), with multi-leg routes, layovers, and an airport table generated from a public dataset"
      - "Built the requirements strip and ranked plan cards, reworked the chat panel, and connected the frontend to the backend's chat endpoint"
      - "Added the agent tool that sends the parsed trip to the page each turn, so the planner fills in as you talk"
      - "Flight search, the rest of the agent backend, and trip sharing were built by teammates"
    url: "https://github.com/boaz-ng/traveling-salesmen"
    image:
      src: "/assets/images/projects/traveling-salesman.webp"
      alt: "The Traveling Salesman frontend: fields for origin, destinations, dates, budget, and preference above a 3D globe showing routes from LAX to Tokyo and Shanghai."
      width: 1200
      height: 750
    cv: true
    cv_tech: "React, d3-geo"
    cv_bullets:
      - "Built most of the React frontend for a conversational flight search tool: trip planner, ranked flight plans, and a reworked chat panel"
      - "Route map as a 2D map and a draggable 3D globe (d3-geo) with multi-leg routes and layovers"

